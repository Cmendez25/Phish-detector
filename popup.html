<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .domain-tag {
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .score-card {
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid transparent;
    }
    .score-num {
      font-size: 28px;
      font-weight: 800;
      display: block;
      margin-top: 4px;
    }
    .safe { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #4ade80; }
    .warning { background: rgba(234, 179, 8, 0.15); border-color: #eab308; color: #facc15; }
    .danger { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #f87171; }
    .flags-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .flags-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 11px;
    }
    .flags-list li {
      background: #1e293b;
      border-left: 3px solid #38bdf8;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>PhishShield SOC</h2>
  </div>
  <div id="domain" class="domain-tag">Evaluating current page...</div>
  
  <div id="scoreCard" class="score-card safe">
    <div>Threat Score</div>
    <span id="scoreValue" class="score-num">0</span>
  </div>

  <div class="flags-title">Detection Telemetry</div>
  <ul id="flagsList" class="flags-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
